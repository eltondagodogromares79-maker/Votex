[package]
name = "org_owner"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
admin = { path = "../admin" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
core_auth = { path = "../../core_auth" }
core_infra = { path = "../core_infra" }
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "rust_decimal", "runtime-tokio-rustls", "macros", "migrate"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
validator = { version = "0.18", features = ["derive"] }

[dev-dependencies]
mockall = "0.13"
serde_json = "1"
