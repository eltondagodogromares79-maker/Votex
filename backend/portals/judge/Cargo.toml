[package]
name = "judge"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
core_auth = { path = "../../core_auth" }
core_infra = { path = "../core_infra" }
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "rust_decimal", "runtime-tokio-rustls"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1"
